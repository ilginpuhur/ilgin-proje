apiVersion: v2
name: ilgin
description: ilgin helm chart
type: application
version: "1.76.0"
dependencies:
  - name: ilgin-backend
    version: 1.76.2
    repository: "@ilgin-helm"
    condition: ilgin-backend.enabled

  - name: ilgin-ui
    version: 5.13.0
    repository: "@ilgin-helm"
    condition: ilgin-ui.enabled

  - name: ilgin-infra
    version: 1.28.0
    repository: "@ilgin-helm"
    condition: ilgin-infra.enabled

  - name: pirireis-gis
    version: 0.1.70
    repository: "@ilgin-helm"
    condition: ilgin-backend.enabled