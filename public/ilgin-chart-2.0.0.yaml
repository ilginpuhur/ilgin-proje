apiVersion: v2
name: Ilgin
description: Ilgin helm chart
type: application
version: "2.0.0"
dependencies:
  - name: Ilgin-backend
    version: 2.0.0
    repository: "@Ilgin-helm"
    condition: Ilgin-backend.enabled

  - name: Ilgin-ui
    version: 6.0.0
    repository: "@Ilgin-helm"
    condition: Ilgin-ui.enabled

  - name: Ilgin-infra
    version: 1.30.0
    repository: "@Ilgin-helm"
    condition: Ilgin-infra.enabled

  - name: pirireis-gis
    version: 0.2.0
    repository: "@Ilgin-helm"
    condition: Ilgin-backend.enabled

  - name: Ilgin-notification
    version: 1.0.0
    repository: "@Ilgin-helm"
    condition: Ilgin-notification.enabled
