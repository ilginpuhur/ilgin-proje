apiVersion: v2
name: Ilgin
description: Ilgin helm chart
type: application
version: "1.74.3"
dependencies:
  - name: Ilgin-backend
    version: 1.74.3
    repository: "@Ilgin-helm"
    condition: Ilgin-backend.enabled

  - name: Ilgin-ui
    version: 5.11.4
    repository: "@Ilgin-helm"
    condition: Ilgin-ui.enabled

  - name: Ilgin-infra
    version: 1.27.0
    repository: "@Ilgin-helm"
    condition: Ilgin-infra.enabled

  - name: pirireis-gis
    version: 0.1.60
    repository: "@Ilgin-helm"
    condition: Ilgin-backend.enabled
