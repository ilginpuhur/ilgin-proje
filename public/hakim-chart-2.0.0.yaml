apiVersion: v2
name: hakim
description: Hakim helm chart
type: application
version: "2.0.0"
dependencies:
  - name: hakim-backend
    version: 2.0.0
    repository: "@hakim-helm"
    condition: hakim-backend.enabled

  - name: hakim-ui
    version: 6.0.0
    repository: "@hakim-helm"
    condition: hakim-ui.enabled

  - name: hakim-infra
    version: 1.30.0
    repository: "@hakim-helm"
    condition: hakim-infra.enabled

  - name: pirireis-gis
    version: 0.2.0
    repository: "@hakim-helm"
    condition: hakim-backend.enabled

  - name: hakim-notification
    version: 1.0.0
    repository: "@hakim-helm"
    condition: hakim-notification.enabled
