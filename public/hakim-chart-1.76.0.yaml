apiVersion: v2
name: hakim
description: Hakim helm chart
type: application
version: "1.76.0"
dependencies:
  - name: hakim-backend
    version: 1.76.2
    repository: "@hakim-helm"
    condition: hakim-backend.enabled

  - name: hakim-ui
    version: 5.13.0
    repository: "@hakim-helm"
    condition: hakim-ui.enabled

  - name: hakim-infra
    version: 1.28.0
    repository: "@hakim-helm"
    condition: hakim-infra.enabled

  - name: pirireis-gis
    version: 0.1.70
    repository: "@hakim-helm"
    condition: hakim-backend.enabled
